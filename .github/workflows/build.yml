name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Unsigned builds. Code signing needs paid certificates; see README.
      - run: npm run ${{ matrix.script }} -w @commonplace/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: commonplace-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error

  # Runs the one-step installers on clean macOS and Windows machines.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os == 'macOS'
        run: bash scripts/install.sh && test -x "$RUNNER_TEMP/commonplace/node_modules/.bin/electron"
        env:
          COMMONPLACE_REPO: ${{ github.workspace }}
          COMMONPLACE_DIR: ${{ runner.temp }}/commonplace
          COMMONPLACE_NO_SHORTCUT: '1'
      - name: renamed to commonplace (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/commonplace
        run: |
          app=node_modules/electron/dist/commonplace.app
          fail () { echo "::error::$1 (dist: $(ls node_modules/electron/dist | tr '\n' ' '); path.txt: $(cat node_modules/electron/path.txt); brand says: $(node apps/desktop/scripts/brand.mjs 2>&1))"; exit 1; }
          test -x "$app/Contents/MacOS/commonplace" || fail "no renamed executable"
          test ! -e node_modules/electron/dist/Electron.app || fail "Electron.app still there"
          test "$(plutil -extract CFBundleName raw "$app/Contents/Info.plist")" = commonplace || fail "CFBundleName not set"
          test "$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")" = commonplace || fail "CFBundleExecutable not set"
          codesign --verify --deep --strict "$app" 2>/tmp/cs.txt || fail "signature: $(cat /tmp/cs.txt)"
          "$(node -p "require('electron')")" --version > /tmp/v.txt 2>&1 || fail "won't start: $(cat /tmp/v.txt)"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\commonplace\node_modules\.bin\electron.cmd")) { throw 'electron missing' }
          if (-not (Test-Path ([Environment]::GetFolderPath('Desktop') + '\commonplace.lnk'))) { throw 'shortcut missing' }
        env:
          COMMONPLACE_REPO: ${{ github.workspace }}
          COMMONPLACE_DIR: ${{ runner.temp }}\commonplace
