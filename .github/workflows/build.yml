name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Unsigned builds. Code signing needs paid certificates; see README.
      - run: npm run ${{ matrix.script }} -w @commonplace/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Apple Silicon refuses to run an app with no signature at all, so the
      # build is signed ad hoc; check it holds up.
      - name: signature (macOS)
        if: runner.os == 'macOS'
        run: for app in apps/desktop/release/mac*/commonplace.app; do codesign --verify --deep --strict "$app"; done
      - uses: actions/upload-artifact@v4
        with:
          name: commonplace-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  # A new version number on main (apps/desktop/package.json) publishes the
  # installers as a GitHub release tagged v<version>, which is what the
  # Download links in the README and the installed app's update check use.
  # Pushing such a tag yourself does the same.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./apps/desktop/package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with: { path: dist, merge-multiple: true }
      # Sign the release (release.json lists every file's SHA-256), so the
      # app installs it only if the project's release key vouches for it.
      - name: sign
        if: steps.v.outputs.new == 'true' && env.RELEASE_SIGNING_KEY != ''
        run: node scripts/release-key.mjs sign dist "${{ steps.v.outputs.tag }}" "${{ github.sha }}"
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.new == 'true'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: commonplace ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
